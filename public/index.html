<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZIP → APK Builder</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <h1>ZIP → APK Builder</h1>
  <p class="muted">Upload project Android, ubah identitas aplikasi, lalu build APK debug.</p>
  <form id="form">
    <label>Project ZIP</label>
    <input id="repo" name="repo" type="file" accept=".zip" required>

    <label>Nama aplikasi</label>
    <input name="appName" value="My App" maxlength="60" required>

    <label>Package name</label>
    <input name="packageName" value="com.example.myapp" pattern="[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+" required>

    <label>Logo / Icon</label>
    <input id="icon" name="icon" type="file" accept="image/png,image/jpeg,image/webp">
    <div class="preview"><img id="preview" alt="Preview icon"><span id="noPreview">Belum ada logo</span></div>

    <button id="build" type="submit">🔨 Build APK</button>
  </form>
  <div id="status"></div>
</main>
<script src="app.js"></script>
</body>
</html>
